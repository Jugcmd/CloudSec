name: Azure Deploy

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Azure resource group name
        required: true
        default: rg-cloudsec-dev
      location:
        description: Azure location
        required: true
        default: spaincentral
      namePrefix:
        description: Resource name prefix (lowercase, 3-12 chars)
        required: true
        default: cloudsec

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG_NAME: ${{ github.event.inputs.resourceGroup }}
      LOCATION: ${{ github.event.inputs.location }}
      NAME_PREFIX: ${{ github.event.inputs.namePrefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Resolved Inputs
        run: |
          echo "RG_NAME=$RG_NAME"
          echo "LOCATION=$LOCATION"
          echo "NAME_PREFIX=$NAME_PREFIX"

      - name: Validate Provider Registrations
        run: |
          set -e
          MISSING=0
          for NS in Microsoft.Web Microsoft.Sql Microsoft.Storage Microsoft.OperationalInsights Microsoft.Insights Microsoft.KeyVault; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv || echo "Unknown")
            echo "$NS registrationState=$STATE"
            if [ "$STATE" != "Registered" ]; then
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "One or more required providers are not registered."
            echo "Ask a subscription admin to register: Microsoft.Web, Microsoft.Sql, Microsoft.Storage, Microsoft.OperationalInsights, Microsoft.Insights"
            exit 1
          fi

      - name: Ensure Resource Group
        run: |
          if ! az group show --name "$RG_NAME" &>/dev/null; then
            echo "Resource group $RG_NAME does not exist. Attempting to create..."
            az group create --name "$RG_NAME" --location "$LOCATION" || {
              echo "ERROR: Could not create resource group."
              echo "On a managed/university subscription, pre-create it manually with your own account:"
              echo "  az group create --name $RG_NAME --location $LOCATION"
              exit 1
            }
          else
            echo "Resource group $RG_NAME already exists, skipping creation."
          fi

      - name: Deploy Infrastructure
        id: infra
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --name "cloudsec-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
            --parameters location="$LOCATION" namePrefix="$NAME_PREFIX" \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}" \
            --parameters jwtSigningKey="${{ secrets.JWT_SIGNING_KEY }}" \
            --parameters budgetAlertEmail="${{ secrets.BUDGET_ALERT_EMAIL }}"

          OUTPUTS=$(az deployment group show \
            --resource-group "$RG_NAME" \
            --name "cloudsec-${{ github.run_number }}" \
            --query properties.outputs -o json)

          API_APP_NAME=$(echo "$OUTPUTS" | jq -r '.apiAppName.value')
          API_URL=$(echo "$OUTPUTS" | jq -r '.apiUrl.value')
          API_HEALTH_URL=$(echo "$OUTPUTS" | jq -r '.apiHealthUrl.value')
          STORAGE_ACCOUNT=$(echo "$OUTPUTS" | jq -r '.frontendStorageAccountName.value')
          FRONTEND_URL=$(echo "$OUTPUTS" | jq -r '.frontendUrl.value')
          KEY_VAULT_NAME=$(echo "$OUTPUTS" | jq -r '.keyVaultName.value')

          echo "api_app_name=$API_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "api_health_url=$API_HEALTH_URL" >> "$GITHUB_OUTPUT"
          echo "storage_account=$STORAGE_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$KEY_VAULT_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test API
        run: dotnet test backend/CloudSec.Api.Tests/CloudSec.Api.Tests.csproj --nologo

      - name: Publish API
        run: dotnet publish backend/CloudSec.Api/CloudSec.Api.csproj -c Release -o publish-api

      - name: Prepare API Package
        run: |
          cd publish-api
          zip -r ../publish-api.zip .

      - name: Wait for App Service SCM Stabilization
        run: |
          echo "Waiting 30 seconds for SCM to stabilise after infra deployment..."
          sleep 30

      - name: Deploy API to Staging Slot
        run: |
          set +e
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Deploy attempt $ATTEMPT of $MAX_ATTEMPTS"
            az webapp deploy \
              --resource-group "$RG_NAME" \
              --name "${{ steps.infra.outputs.api_app_name }}" \
              --slot staging \
              --src-path publish-api.zip \
              --type zip \
              --async true

            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Staging deployment upload succeeded on attempt $ATTEMPT"
              break
            fi

            echo "Upload failed on attempt $ATTEMPT. Waiting 30 seconds before retry..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "Staging deployment failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "Waiting for staging slot to become healthy..."
          STAGING_HEALTH="https://${{ steps.infra.outputs.api_app_name }}-staging.azurewebsites.net/healthz"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_HEALTH" || echo "000")
            echo "Staging health check $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Staging slot is healthy — proceeding to swap."
              break
            fi
            sleep 15
          done

      - name: Swap Staging to Production
        run: |
          az webapp deployment slot swap \
            --resource-group "$RG_NAME" \
            --name "${{ steps.infra.outputs.api_app_name }}" \
            --slot staging \
            --target-slot production
          echo "Slot swap complete — production is now running the new deployment."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          VITE_API_BASE_URL=${{ steps.infra.outputs.api_url }} npm run build

      - name: Deploy Frontend Static Website
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RG_NAME" \
            --account-name "${{ steps.infra.outputs.storage_account }}" \
            --query '[0].value' -o tsv)

          az storage blob service-properties update \
            --account-name "${{ steps.infra.outputs.storage_account }}" \
            --account-key "$STORAGE_KEY" \
            --static-website \
            --index-document index.html \
            --404-document index.html

          az storage blob upload-batch \
            --account-name "${{ steps.infra.outputs.storage_account }}" \
            --account-key "$STORAGE_KEY" \
            --source frontend/dist \
            --destination '$web' \
            --overwrite

      - name: Deployment Summary
        run: |
          echo "API URL: ${{ steps.infra.outputs.api_url }}"
          echo "API Health URL: ${{ steps.infra.outputs.api_health_url }}"
          echo "Frontend URL: ${{ steps.infra.outputs.frontend_url }}"
          echo "Key Vault: ${{ steps.infra.outputs.key_vault_name }}"
